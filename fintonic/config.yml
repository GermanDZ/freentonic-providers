# Per-provider declarative config for Fintonic.
#
# Loaded by Freentonic::Providers::Config.load_provider!(__dir__) at the
# top of normalizer.rb. Parsed via YAML.safe_load with permitted_classes=[]
# and aliases=false — pure data only.

institution: fintonic
scraper_version: fintonic/0.2

# Per-transaction logical field aliases. operationDate is the bank-side
# date; userDate is the user-edited date inside Fintonic — see
# build_transaction's comment for why we prefer the former for the
# canonical date but preserve userDate in metadata.
field_aliases:
  date:             [operationDate, valueDate, userDate]
  description:      [description, cleanNote, primaryDisplay]
  user_description: [userDescription, cleanUserDescription]

# Fintonic product type string → canonical kind.
kind_by_type:
  ACCOUNT:     asset
  CREDIT_CARD: liability
  CREDITCARD:  liability

# Allowlist of raw transaction fields preserved into transaction.metadata.
# Only the simple-rename fields live here; category_path and category_id
# are computed from the category_map at call time and merged in
# imperatively (Ruby) since their values aren't a pure projection of tx.
raw_fields_transaction:
  id:               id
  reference:        reference
  operationDate:    operationDate
  valueDate:        valueDate
  userDate:         userDate
  description:      description
  cleanNote:        cleanNote
  userDescription:  userDescription
  primaryDisplay:   primaryDisplay
