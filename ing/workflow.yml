version: 1

config:
  key: ing
  default_lookback_days: 90

secrets:
  USER_DNI:
    prompt: "ING DNI / user ID"
  USER_BIRTHDAY_DD:
    prompt: "ING birthday day (DD)"
  USER_BIRTHDAY_MM:
    prompt: "ING birthday month (MM)"
  USER_BIRTHDAY_YYYY:
    prompt: "ING birthday year (AAAA)"
  USER_PIN:
    prompt: "ING full PIN (all digits, e.g. 123456)"

pipeline:
  - connect
  - dismiss_cookie_banner
  - login
  - post_login
  - capture_credentials

phases:
  connect:
    - action: navigate
      url: "https://ing.ingdirect.es/app-login/"
    - action: wait_url
      includes: "ingdirect"
      timeout: 15
    - action: simulate_human
      duration: 5
  dismiss_cookie_banner:
    - action: wait_for_first_of
      selectors:
        - "#didomi-notice-agree-button"
        - "input[name=\"document\"]"
        - ".container-pinpad"
      timeout: 30
    - action: click_if_present
      selector: "#didomi-notice-agree-button"
  login:
    - action: wait_for_first_of
      selectors:
        - "input[name=\"document\"]"
        - ".container-pinpad"
      timeout: 30
    - action: fill_if_present
      selector: "input[name=\"document\"]"
      value: "secret(USER_DNI)"
    - action: fill_if_present
      selector: "input[placeholder=\"DD\"]"
      value: "secret(USER_BIRTHDAY_DD)"
    - action: fill_if_present
      selector: "input[placeholder=\"MM\"]"
      value: "secret(USER_BIRTHDAY_MM)"
    - action: fill_if_present
      selector: "input[placeholder=\"AAAA\"]"
      value: "secret(USER_BIRTHDAY_YYYY)"
    - action: click_if_present
      selector: "input[name=\"isRemembered\"]"
    - action: click_if_present
      selector: "ing-button[data-element-click-id=\"ENTER_CREDENTIALS_CLICK\"]"
    - action: wait_for_shadow_selector
      host: "ing-pin-pad"
      selector: ".dots-indicator"
      timeout: 30
    - action: enter_pin_pad
      selector: "ing-pin-pad"
      pin: "secret(USER_PIN)"
    - action: note_if_selector
      selector: "push-notification-page[data-page-id=\"NOTIFICATION_PUSH\"]"
      message: "⏳ ING requires 2FA — open the ING app on your phone and approve the login notification."
    - action: wait_url
      includes: "pfm/#overall-position"
      timeout: 120
  post_login:
    - action: navigate
      url: "https://ing.ingdirect.es/pfm/#overall-position/inicio"
    - action: wait_network_idle
      seconds: 5
  capture_credentials:
    - action: capture_cookie_header
      host: "ing.ingdirect.es"
      path: "/genoma_api/rest/"
      as: cookie
    # Best-effort: snapshot the bank's frontend state alongside the
    # cookie so the api_client can later thread JS-computed auth headers
    # (Authorization Bearer, X-XSRF-TOKEN, X-ING-ExtendedSessionContext)
    # without trying to mint them from outside the browser. Required:
    # false because routine post-login state varies — when the
    # dashboard hasn't fired /position-keeping by the time this phase
    # runs, the captures are simply absent and the extractor stays on
    # the legacy path.
    - action: capture_local_storage
      origin: "https://ing.ingdirect.es"
      as: ing_local_storage
      required: false
    - action: capture_outbound_request_headers
      host: "api.ing.ingdirect.es"
      path: "/position-keeping"
      headers:
        - "Authorization"
        - "X-XSRF-TOKEN"
        - "X-ING-ExtendedSessionContext"
      as: ing_api_headers
      most_recent: true
      required: false

credentials:
  require:
    - cookie
  validate:
    - key: cookie
      not_empty: true
      contains: "genoma-session-id="
  map:
    - from: cookie
      as: cookie
      log_extra: "{cookie_cookie_count} cookies"
    - from: ing_local_storage
      as: ing_local_storage
      log: false
    - from: ing_api_headers
      as: ing_api_headers
      log: false

api_client:
  base_url: "https://ing.ingdirect.es"
  credentials:
    - cookie
    - ing_local_storage
    - ing_api_headers
  batch_keys:
    - transactions
    - movements
    - elements
    - resultList
  date_format: "%d/%m/%Y"
  # Two hosts with different auth scopes:
  #   - ing.ingdirect.es        → legacy cookie-only endpoints (SCA
  #     documentation handshake; imperative, not declared here).
  #   - api.ing.ingdirect.es    → v2 endpoints (assets + credit cards),
  #     additionally signed with the JS-computed Bearer +
  #     ExtendedSessionContext captured by the workflow's
  #     capture_outbound_request_headers step. The api host edge rejects
  #     requests carrying a wrong-scope Bearer aimed at the legacy host,
  #     so the Bearer MUST be host-scoped.
  auth_headers:
    - headers:
        Cookie:            "{cookie}"
        genoma-session-id: "{genoma_session_id}"
        Content-Type:      "application/json"
        Origin:            "https://ing.ingdirect.es"
        Referer:           "https://ing.ingdirect.es/"
    - host: "api.ing.ingdirect.es"
      headers:
        # The two JS-computed values are plucked out of the
        # ing_api_headers Hash credential via derived_credentials
        # below — capture_outbound_request_headers emits one Hash
        # per call but auth_header from: needs a scalar accessor.
        Authorization:                "{ing_api_authorization}"
        X-ING-ExtendedSessionContext: "{ing_api_esc}"
        # CSRF echo. ING's API edge enforces CSRF on state-changing
        # methods (the /v2/products/transactions/search POST is the
        # first POST in our v2 path). When this header is absent on a
        # POST, ING SILENTLY returns HTTP 200 with an empty
        # transactions array — no 4xx, no error — and the bridge sees
        # a successful-looking response carrying no data. Echo the
        # XSRF-TOKEN cookie value as a header on every api-host
        # request; GETs ignore it harmlessly.
        X-XSRF-TOKEN:                 "{xsrf_token}"
  derived_credentials:
    genoma_session_id:
      from: cookie
      regex: 'genoma-session-id=([^;]+)'
      capture: 1
    # The bank's SPA reads XSRF-TOKEN from the cookie via JS and
    # echoes it on outbound POSTs. The cookie is captured first by
    # capture_cookie_header in capture_credentials, so this is the
    # canonical source — pulling from the cookie rather than the
    # ing_api_headers Hash (which is required: false and may be
    # absent on some login paths) keeps the wiring robust.
    xsrf_token:
      from: cookie
      regex: 'XSRF-TOKEN=([^;]+)'
      capture: 1
    ing_api_authorization:
      from: ing_api_headers
      key:  Authorization
    ing_api_esc:
      from: ing_api_headers
      key:  X-ING-ExtendedSessionContext
  endpoints:
    # v2 product list — api host, Bearer auth.
    - name: fetch_position_keeping
      method: GET
      base:   "https://api.ing.ingdirect.es"
      path:   "/position-keeping"
    # Unified transactions search — api host, Bearer auth, JSON body
    # with an array of product UUIDs. Replaces the per-product
    # /v2/products/{uuid}/transactions (assets) and
    # /v2/products/credit-cards/{uuid}/extract (cards) endpoints with
    # a single date-range-windowed call that handles both kinds.
    #
    # Why this is the right endpoint:
    #  - Date range (fromDate/toDate) instead of mode= scoping — older
    #    cleared CC postings are retrievable, and pending → cleared
    #    status transitions are observable (the cleared row reappears
    #    under the same transactionSequence).
    #  - Same stable id (transactionId.transactionSequence) across all
    #    product kinds → v2-seq:<productId>:<seq> dedupes naturally.
    #  - Multi-product (uuids: [...]) lets a single POST cover the full
    #    product list per page.
    #
    # Trade-offs accepted:
    #  - `amount` arrives as a String here (vs Numeric from the
    #    per-product endpoints); the extractor coerces in
    #    coerce_v2_search_to_legacy_shape.
    #  - The CC `status` hash ("Pendiente de liquidar") is not exposed
    #    by /search — CC rows normalize as `settled` regardless of
    #    lifecycle stage. Acceptable: the canonical-id stability fix
    #    is what we needed; pending-status fidelity for CC rows is
    #    cosmetic for our consumers.
    #  - SCA elevation boundary is 90 days here (vs the ~52d silent
    #    truncation of /v2/products/{uuid}/transactions); see
    #    SCA_ELEVATION_LOOKBACK_DAYS in extractor.rb.
    - name: fetch_v2_search
      method: POST
      base:   "https://api.ing.ingdirect.es"
      path:   "/v2/products/transactions/search"
      json:
        uuids:       "{uuids}"
        fromDate:    "{from_date|iso}"
        toDate:      "{to_date|iso}"
        offset:      "{offset}"
        limit:       100
        withComment: false
      pagination: offset
      limit: 100
      response:
        extract_batch: [transactions]
    # SCA refresh — api host. The SCA documentation endpoints stay
    # imperative in the extractor (operator prompt is genuinely
    # imperative); only the post-SCA Bearer-refresh is declarative.
    - name: refresh_access_token
      method: GET
      base:   "https://api.ing.ingdirect.es"
      path:   "/saf/tpa/accesstoken/synchronize"

extract:
  ruby: ./extractor.rb
  class: Freentonic::Providers::Ing::Extractor

normalize:
  ruby: ./normalizer.rb
  class: Freentonic::Providers::Ing::Normalizer
