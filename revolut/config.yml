# Per-provider declarative config for Revolut.
#
# Loaded by Freentonic::Providers::NormalizerBase#provider!(__dir__).
# Top-level keys become UPCASE class constants on the normalizer
# (so `institution: revolut` becomes `INSTITUTION = "revolut"`).

institution: revolut
scraper_version: revolut/0.2

# Timezone for reducing an instant to a canonical calendar Date. Revolut's
# transaction dates are absolute instants (epoch-ms startedDate, or Zulu
# ISO), so the calendar day depends on the zone we bucket them into. The
# framework default is UTC; our accounts are Spain-based, so we book by the
# Madrid calendar day — a near-midnight purchase lands on the day the user
# actually saw it in the bank app, not the UTC day.
#
# Europe/Madrid is a DST-correct IANA zone and needs the tzinfo gem (see the
# providers Gemfile). input_timezone only matters for offset-naive datetime
# strings, which Revolut never sends; set for symmetry / future-proofing.
input_timezone: Europe/Madrid
output_timezone: Europe/Madrid

# Revolut emits the same logical field under different keys depending
# on the entity (vault vs pocket) or the transaction lifecycle stage
# (started vs completed). Declare alias chains so the normalizer
# doesn't carry them inline.
field_aliases:
  vault_balance: [balance, currentAmount]
  tx_date:       [startedDate, completedDate, createdDate]

# Revolut returns the full event log per posting (COMPLETED, PENDING,
# DECLINED authorization retries, REVERTED reversed transfers, FAILED
# top-ups). The canonical layer preserves the full log; SimpleFIN
# serving filters non-posted statuses before exposing to clients.
status_map:
  COMPLETED: posted
  PENDING:   pending
  DECLINED:  declined
  FAILED:    failed
  REVERTED:  reverted

# Allowlist of raw transaction fields preserved into transaction.metadata
# (mirrors ING's raw_fields_movement). Replaces embedding the full raw `tx`
# hash, which carried legs/counterparty/everything into every canonical
# transaction.
raw_fields_transaction:
  id:            id
  legId:         legId
  amount:        amount
  currency:      currency
  description:   description
  type:          type
  state:         state
  merchant:      merchant.name
  startedDate:   startedDate
  completedDate: completedDate
  createdDate:   createdDate
