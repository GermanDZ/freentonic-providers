version: 1

config:
  key: ing
  default_lookback_days: 90

secrets:
  USER_DNI:
    prompt: "ING DNI / user ID"
  USER_BIRTHDAY_DD:
    prompt: "ING birthday day (DD)"
  USER_BIRTHDAY_MM:
    prompt: "ING birthday month (MM)"
  USER_BIRTHDAY_YYYY:
    prompt: "ING birthday year (AAAA)"
  USER_PIN:
    prompt: "ING full PIN (all digits, e.g. 123456)"

pipeline:
  - connect
  - dismiss_cookie_banner
  - login
  - post_login
  - capture_credentials

phases:
  connect:
    - action: navigate
      url: "https://ing.ingdirect.es/app-login/"
    - action: wait_url
      includes: "ingdirect"
      timeout: 15
    - action: simulate_human
      duration: 5
  dismiss_cookie_banner:
    - action: wait_for_first_of
      selectors:
        - "#didomi-notice-agree-button"
        - "input[name=\"document\"]"
        - ".container-pinpad"
      timeout: 30
    - action: click_if_present
      selector: "#didomi-notice-agree-button"
  login:
    - action: wait_for_first_of
      selectors:
        - "input[name=\"document\"]"
        - ".container-pinpad"
      timeout: 30
    - action: fill_if_present
      selector: "input[name=\"document\"]"
      value: "secret(USER_DNI)"
    - action: fill_if_present
      selector: "input[placeholder=\"DD\"]"
      value: "secret(USER_BIRTHDAY_DD)"
    - action: fill_if_present
      selector: "input[placeholder=\"MM\"]"
      value: "secret(USER_BIRTHDAY_MM)"
    - action: fill_if_present
      selector: "input[placeholder=\"AAAA\"]"
      value: "secret(USER_BIRTHDAY_YYYY)"
    - action: click_if_present
      selector: "input[name=\"isRemembered\"]"
    - action: click_if_present
      selector: "ing-button[data-element-click-id=\"ENTER_CREDENTIALS_CLICK\"]"
    - action: wait_for_shadow_selector
      host: "ing-pin-pad"
      selector: ".dots-indicator"
      timeout: 30
    - action: enter_pin_pad
      selector: "ing-pin-pad"
      pin: "secret(USER_PIN)"
    - action: note_if_selector
      selector: "push-notification-page[data-page-id=\"NOTIFICATION_PUSH\"]"
      message: "⏳ ING requires 2FA — open the ING app on your phone and approve the login notification."
    - action: wait_url
      includes: "pfm/#overall-position"
      timeout: 120
  post_login:
    - action: navigate
      url: "https://ing.ingdirect.es/pfm/#overall-position/inicio"
    - action: wait_network_idle
      seconds: 5
  capture_credentials:
    - action: capture_cookie_header
      host: "ing.ingdirect.es"
      path: "/genoma_api/rest/"
      as: cookie
    # Best-effort: snapshot the bank's frontend state alongside the
    # cookie so the api_client can later thread JS-computed auth headers
    # (Authorization Bearer, X-XSRF-TOKEN, X-ING-ExtendedSessionContext)
    # without trying to mint them from outside the browser. Required:
    # false because routine post-login state varies — when the
    # dashboard hasn't fired /position-keeping by the time this phase
    # runs, the captures are simply absent and the extractor stays on
    # the legacy path.
    - action: capture_local_storage
      origin: "https://ing.ingdirect.es"
      as: ing_local_storage
      required: false
    - action: capture_outbound_request_headers
      host: "api.ing.ingdirect.es"
      path: "/position-keeping"
      headers:
        - "Authorization"
        - "X-XSRF-TOKEN"
        - "X-ING-ExtendedSessionContext"
      as: ing_api_headers
      most_recent: true
      required: false

credentials:
  require:
    - cookie
  validate:
    - key: cookie
      not_empty: true
      contains: "genoma-session-id="
  map:
    - from: cookie
      as: cookie
      log_extra: "{cookie_cookie_count} cookies"
    - from: ing_local_storage
      as: ing_local_storage
      log: false
    - from: ing_api_headers
      as: ing_api_headers
      log: false

api_client:
  base_url: "https://ing.ingdirect.es"
  credentials:
    - cookie
    - ing_local_storage
    - ing_api_headers
  batch_keys:
    - transactions
    - movements
    - elements
    - resultList
  date_format: "%d/%m/%Y"
  # Two hosts with different auth scopes:
  #   - ing.ingdirect.es        → legacy cookie-only endpoints (the SCA
  #     documentation handshake, declared below and driven by the
  #     elevate: phase).
  #   - api.ing.ingdirect.es    → v2 endpoints (assets + credit cards),
  #     additionally signed with the JS-computed Bearer +
  #     ExtendedSessionContext captured by the workflow's
  #     capture_outbound_request_headers step. The api host edge rejects
  #     requests carrying a wrong-scope Bearer aimed at the legacy host,
  #     so the Bearer MUST be host-scoped.
  auth_headers:
    - headers:
        Cookie:            "{cookie}"
        genoma-session-id: "{genoma_session_id}"
        Content-Type:      "application/json"
        Origin:            "https://ing.ingdirect.es"
        Referer:           "https://ing.ingdirect.es/"
    - host: "api.ing.ingdirect.es"
      headers:
        # The two JS-computed values are plucked out of the
        # ing_api_headers Hash credential via derived_credentials
        # below — capture_outbound_request_headers emits one Hash
        # per call but auth_header from: needs a scalar accessor.
        Authorization:                "{ing_api_authorization}"
        X-ING-ExtendedSessionContext: "{ing_api_esc}"
        # CSRF echo. ING's API edge enforces CSRF on state-changing
        # methods (the /v2/products/transactions/search POST is the
        # first POST in our v2 path). When this header is absent on a
        # POST, ING SILENTLY returns HTTP 200 with an empty
        # transactions array — no 4xx, no error — and the bridge sees
        # a successful-looking response carrying no data. Echo the
        # XSRF-TOKEN cookie value as a header on every api-host
        # request; GETs ignore it harmlessly.
        X-XSRF-TOKEN:                 "{xsrf_token}"
  derived_credentials:
    genoma_session_id:
      from: cookie
      regex: 'genoma-session-id=([^;]+)'
      capture: 1
    # The bank's SPA reads XSRF-TOKEN from the cookie via JS and
    # echoes it on outbound POSTs. The cookie is captured first by
    # capture_cookie_header in capture_credentials, so this is the
    # canonical source — pulling from the cookie rather than the
    # ing_api_headers Hash (which is required: false and may be
    # absent on some login paths) keeps the wiring robust.
    xsrf_token:
      from: cookie
      regex: 'XSRF-TOKEN=([^;]+)'
      capture: 1
    ing_api_authorization:
      from: ing_api_headers
      key:  Authorization
    ing_api_esc:
      from: ing_api_headers
      key:  X-ING-ExtendedSessionContext
  endpoints:
    # v2 product list — api host, Bearer auth.
    - name: fetch_position_keeping
      method: GET
      base:   "https://api.ing.ingdirect.es"
      path:   "/position-keeping"
    # Unified transactions search — api host, Bearer auth, JSON body
    # with an array of product UUIDs. Replaces the per-product
    # /v2/products/{uuid}/transactions (assets) and
    # /v2/products/credit-cards/{uuid}/extract (cards) endpoints with
    # a single date-range-windowed call that handles both kinds.
    #
    # Why this is the right endpoint:
    #  - Date range (fromDate/toDate) instead of mode= scoping — older
    #    cleared CC postings are retrievable, and pending → cleared
    #    status transitions are observable (the cleared row reappears
    #    under the same transactionSequence).
    #  - Same stable id (transactionId.transactionSequence) across all
    #    product kinds → v2-seq:<productId>:<seq> dedupes naturally.
    #  - Multi-product (uuids: [...]) lets a single POST cover the full
    #    product list per page.
    #
    # Trade-offs accepted:
    #  - `amount` arrives as a String here (vs Numeric from the
    #    per-product endpoints); the extractor coerces in
    #    coerce_v2_search_to_legacy_shape.
    #  - The CC `status` hash ("Pendiente de liquidar") is not exposed
    #    by /search — CC rows normalize as `settled` regardless of
    #    lifecycle stage. Acceptable: the canonical-id stability fix
    #    is what we needed; pending-status fidelity for CC rows is
    #    cosmetic for our consumers.
    #  - SCA elevation boundary is 90 days here (vs the ~52d silent
    #    truncation of /v2/products/{uuid}/transactions); see the
    #    elevate: block's when: gate below.
    - name: fetch_v2_search
      method: POST
      base:   "https://api.ing.ingdirect.es"
      path:   "/v2/products/transactions/search"
      json:
        uuids:       "{uuids}"
        fromDate:    "{from_date|iso}"
        toDate:      "{to_date|iso}"
        offset:      "{offset}"
        limit:       100
        withComment: false
      pagination: offset
      limit: 100
      response:
        extract_batch: [transactions]
    # SCA session-elevation endpoints — consumed by the elevate: phase
    # below, never by the extract path.
    #
    # The documentation handshake lives on the legacy host (default
    # base_url, cookie auth): GET initiates the challenge — the
    # x-ing-reset-validations header forces a fresh push even when a
    # stale process is pending — and PUT commits it once the operator
    # approves on their phone.
    - name: sca_documentation_challenge
      method: GET
      path:   "/genoma_api/rest/sca/documentation"
      headers:
        x-ing-reset-validations: "1"
    - name: sca_documentation_commit
      method: PUT
      path:   "/genoma_api/rest/sca/documentation"
      headers:
        x-ing-securityprocessid: "{process_id}"
      json:
        processId: "{process_id}"
    # Post-SCA Bearer refresh — api host. Mints the elevated (high-LoA)
    # access token that rebind_credential installs.
    - name: refresh_access_token
      method: GET
      base:   "https://api.ing.ingdirect.es"
      path:   "/saf/tpa/accesstoken/synchronize"

# Session elevation — the PSD2 SCA handshake that used to live in
# extractor.rb (attempt_sca_elevation + refresh_bearer_after_sca).
# /search rejects date ranges older than 90 days from a low-LoA Bearer
# (`moreSca: true`, silently truncating at the boundary), so elevation
# is only worth the operator round-trip when the requested lookback
# actually crosses it — the when: gate skips the whole phase otherwise.
#
# on_failure: degrade encodes ING's behavior matrix verbatim: an SCA
# push timeout, a missing securityProcessId, an absent operator channel
# or an empty refreshed token all warn and continue with the captured
# low-LoA Bearer (history truncates at ~90d) instead of failing the
# run. On degrade the framework discards the half-elevated client, so
# extract rebuilds a pristine one from the captured credentials.
elevate:
  when: { lookback_days: { gt: 90 } }
  on_failure: degrade
  steps:
    - fetch: sca_documentation_challenge
      as: challenge
    - await_operator_approval:
        message: "ING is requesting Strong Customer Authentication to release older transaction history. Open the ING app on your phone, tap the pending notification, and approve. The sync will automatically resume once approved. (challenge: {challenge.acceptanceMethods.0.code})"
        timeout: 180
    - fetch: sca_documentation_commit
      args: { process_id: "{challenge.acceptanceMethods.0.securityProcessId}" }
    # The commit raises the session's level of assurance server-side;
    # synchronize exchanges it for the elevated Bearer.
    - fetch: refresh_access_token
      as: refreshed
    # Host-scoped: the new Bearer must reach api.ing.ingdirect.es and
    # ONLY the api host — the legacy host stays cookie-only (its edge
    # rejects requests carrying a wrong-scope Bearer).
    - rebind_credential:
        header: Authorization
        host: api.ing.ingdirect.es
        value: "Bearer {refreshed.accessTokens.0.accessToken}"

# Declarative extract — the zero-Ruby replacement for extractor.rb.
# /position-keeping yields the product list; index_by builds the
# V1ID→v2-UUID map that lookup: reads back per product to join ING's
# two product lists (legacyProducts carry `type` for kind routing;
# modern products carry the UUID identifiers). Movements land in a
# uuid→rows map (keyed by each product's local uuid) attached VERBATIM;
# all shape translation (String→Numeric amounts, ISO→DD/MM/YYYY dates,
# v2-seq stable-id synthesis) stays in the normalizer, which joins the
# map back onto each product.
#
# Two accepted residues from the old Ruby (see the Ask 6 migration
# note in docs/ing-declarative-framework-asks.md):
#  - The Bearer-missing preflight collapses into /position-keeping's
#    on_error abort — same operator outcome, one HTTP round-trip. The
#    XSRF-cookie warning is dropped (credentials are not in plan scope).
#  - Product routing enumerates the known-skip type ints (1 debit,
#    42 investment, 77 loan) as skip_when steps instead of the old
#    kind whitelist. It fails OPEN for genuinely new types (they get
#    fetched, safe:-degraded, and the normalizer drops any with a nil
#    kind) — acceptable and loud in the run log.
extract:
  plan:
    steps:
      # /position-keeping is the product list. Failure is fatal: a
      # missing list would emit a successful 0-account payload that
      # downstream stores read as "all accounts deleted", overwriting
      # real history. A missing/stale Bearer surfaces here too (the old
      # explicit credential preflight now collapses into this abort).
      - fetch: fetch_position_keeping
        as: position
        on_error:
          abort: "ING extract: /position-keeping failed — without the product list the run cannot continue. Re-run after a fresh login; if it persists, the captured Bearer / ExtendedSessionContext may be stale."
      - select: { from: position, path: legacyProducts }
        as: products
      # A 200 with no legacyProducts array (malformed body / stale
      # session) is as fatal as a network failure: an empty product list
      # emits a 0-account payload that downstream stores read as "all
      # accounts deleted". No default: on the select above, so a missing
      # array binds nil and this abort fires. An empty-but-present array
      # is legitimate (a user with no products) and passes through.
      - abort: "ING extract: /position-keeping returned no legacyProducts array — the product list is unknown and the run cannot continue. Re-run after a fresh login."
        when: { products: { absent: true } }
      - select: { from: position, path: products, default: [] }
        as: modern_products

      # V1ID(LOCAL_UUID) → v2 UUID. index_by builds it; lookup reads it
      # back per product below. A modern product missing either id drops
      # out of the map, so its lookup misses and the product is skipped
      # loudly rather than silently re-routed to the retired /movements.
      - index_by:
          from: modern_products
          key:   { path: identifiers, where: { type: LOCAL_UUID }, pick: value }
          value: { path: identifiers, where: { type: UUID },       pick: value }
        as: uuid_map

      # Per-product /search — ONE CALL PER UUID. A multi-UUID body flips
      # ING into a sign-stripping "summary" format; a single-UUID body
      # keeps the detailed signed shape that matches the bank's XLS
      # export (verified live 2026-05-22; see API-NOTES.md). Rows attach
      # VERBATIM into a uuid→rows map keyed by the product's local uuid;
      # the normalizer joins and translates. A product that is skipped
      # (no v2 UUID, or a skip-listed type) simply gets no map entry, so
      # the normalizer still emits its account (balance-only) with no
      # transactions.
      - for_each:
          source: products
        as_item: product
        as: movements_by_uuid
        collect: map
        key: "{product.uuid}"
        do:
          - select: { from: product, path: type }
            as: type
          - lookup: { from: uuid_map, key: "{product.uuid}" }
            as: v2_uuid

          # No stable v2 UUID → no stable id path. Skip loudly.
          - warn: "No v2 UUID for {product.alias} (local={product.uuid}) — skipping extraction."
            when: { v2_uuid: { absent: true } }
          - skip_when: { v2_uuid: { absent: true } }

          # Debit cards (type 1): not balance-bearing; the normalizer
          # drops them (kind=null). No point fetching.
          - skip_when: { type: { eq: 1 } }

          # Investment (type 42, Cuenta de valores): /search returns 401
          # for investment UUIDs and poisons any multi-UUID batch. Skip
          # the fetch; the account still flows through /position-keeping.
          - note: "Skipping {product.alias} (kind=investment): /search 401s on investment UUIDs."
            when: { type: { eq: 42 } }
          - skip_when: { type: { eq: 42 } }

          # Loans (type 77): amortization isn't in /search; payments post
          # on the linked account. Balance-only.
          - note: "Serving {product.alias} balance-only (kind=loan)."
            when: { type: { eq: 77 } }
          - skip_when: { type: { eq: 77 } }

          - fetch: fetch_v2_search
            args:
              uuids:     ["{v2_uuid}"]
              from_date: "{from_date}"
              to_date:   "{today}"
            as: rows
            safe: true
            default: []
          - yield: "{rows}"
    output:
      products: "{products}"
      movements_by_uuid: "{movements_by_uuid}"

normalize:
  plan:
    steps:
      - select: { from: raw, path: products, default: [] }
        as: products
      - select: { from: raw, path: movements_by_uuid, default: {} }
        as: movements_by_uuid
      # lookup.from: must name a bound value, so lift the kind table out of
      # config into a local binding.
      - select: { from: config, path: kind_by_product_type }
        as: kind_by_type

      # ================= ACCOUNTS =================
      # One pass per canonical kind (from config.kind_by_product_type): the
      # portable-key derivation (card PAN / IBAN / BBAN) and balance source
      # differ by kind, so splitting keeps each pass branch-free. A nil kind
      # (debit card type 1, or an unlisted type) is dropped in every pass.
      # Account order is therefore kind-grouped (checking, then cards, then
      # loans) rather than raw-product order — deterministic, and downstream
      # is id-keyed.

      # ---- checking (asset + investment): IBAN portable, top-level balance
      - for_each: { source: products }
        as_item: product
        as: checking_accounts
        do:
          - lookup: { from: kind_by_type, key: "{product.type}" }
            as: kind
          - skip_when: { kind: { absent: true } }
          - skip_when: { kind: { eq: liability } }
          - skip_when: { kind: { eq: loan } }
          - apply: remove_whitespace
            args: { value: "{product.iban}" }
            as: iban
          - apply: spanish_iban_portable_keys
            args: { iban: "{iban}", bank_code: "{config.bank_code}" }
            as: portable
          - apply: cents
            args: { amount: "{product.balance}" }
            as: balance_cents
          - apply: cents_to_amount
            args: { cents: "{balance_cents}" }
            as: balance_amount
          - apply: first_present
            args: { candidates: ["{product.alias}", "{product.name}", "ING"] }
            as: name
          - let: currency
            coalesce: ["{product.currency}", "EUR"]
          - apply: compact
            args:
              hash:
                ing_product_type: "{product.type}"
                ing_product_number: "{product.productNumber}"
                balance_source: "ing_live:product_balance"
                partial_data_suspected: "{product._partial_data_suspected}"
            as: metadata
          - apply: build_account
            args:
              institution: "{config.institution}"
              source_id: "{product.uuid}"
              currency: "{currency}"
              name: "{name}"
              type: checking
              iban: "{iban}"
              portable_ref: "{portable.0}"
              portable_id: "{portable.1}"
              balance: { current: "{balance_amount}", timestamp: null }
              metadata: "{metadata}"
            as: account
          - yield: "{account}"

      # ---- credit cards: PAN portable, per-plastic monthPurchasesAmount as
      # the negative balance (the live path — each plastic is independent;
      # the old line-reconciliation fallback is dead, verified against real
      # data). Emits a companion liability.
      - for_each: { source: products }
        as_item: product
        as: liability_results
        do:
          - lookup: { from: kind_by_type, key: "{product.type}" }
            as: kind
          - skip_when: { kind: { neq: liability } }
          - apply: card_pan_portable_keys
            args: { pan: "{product.productNumber}", bank_code: "{config.bank_code}" }
            as: portable
          - apply: cents
            args: { amount: "{product.monthPurchasesAmount}" }
            as: mp_cents
          - apply: negate
            args: { value: "{mp_cents}" }
            as: balance_cents
          - apply: cents_to_amount
            args: { cents: "{balance_cents}" }
            as: balance_amount
          - apply: first_present
            args: { candidates: ["{product.alias}", "{product.name}", "ING"] }
            as: base_name
          # Disambiguate identically-aliased plastics by PAN last-4 so
          # SimpleFIN clients don't merge them into one account.
          - apply: pan_last4
            args: { value: "{product.productNumber}" }
            as: last4
          - apply: append_suffix
            args: { base: "{base_name}", suffix: "{last4}", separator: " ·" }
            as: name
          - let: currency
            coalesce: ["{product.currency}", "EUR"]
          - apply: compact
            args:
              hash:
                ing_product_type: "{product.type}"
                ing_product_number: "{product.productNumber}"
                balance_source: "ing_live:card_purchases"
                ing_month_purchases: "{product.monthPurchasesAmount}"
                partial_data_suspected: "{product._partial_data_suspected}"
            as: metadata
          - apply: build_account
            args:
              institution: "{config.institution}"
              source_id: "{product.uuid}"
              currency: "{currency}"
              name: "{name}"
              type: credit_card
              portable_ref: "{portable.0}"
              portable_id: "{portable.1}"
              balance: { current: "{balance_amount}", timestamp: null }
              metadata: "{metadata}"
            as: account
          - apply: build_liability
            args:
              account_id: "{account.id}"
              type: credit_card
              currency: "{account.currency}"
              source_id: "{product.uuid}"
              metadata:
                ing_product_type: "{product.type}"
                ing_product_number: "{product.productNumber}"
            as: liability
          - yield: { account: "{account}", liability: "{liability}" }

      # ---- loans: BBAN portable (productNumber last-4), top-level balance
      # (negative = owed). Balance-only — /search returns no loan movements.
      # Emits a loan liability carrying the loan economics + next-payment
      # due date.
      - for_each: { source: products }
        as_item: product
        as: loan_results
        do:
          - lookup: { from: kind_by_type, key: "{product.type}" }
            as: kind
          - skip_when: { kind: { neq: loan } }
          - apply: pan_last4
            args: { value: "{product.productNumber}" }
            as: last4
          - apply: join_present
            args: { parts: ["{config.bank_code}", "{last4}"], separator: ":" }
            as: portable_ref
          - apply: join_present
            args: { parts: ["bank", "{config.bank_code}", "{last4}"], separator: ":" }
            as: portable_id
          - apply: cents
            args: { amount: "{product.balance}" }
            as: balance_cents
          - apply: cents_to_amount
            args: { cents: "{balance_cents}" }
            as: balance_amount
          - apply: first_present
            args: { candidates: ["{product.alias}", "{product.name}", "ING"] }
            as: name
          - let: currency
            coalesce: ["{product.currency}", "EUR"]
          - apply: compact
            args:
              hash:
                ing_product_type: "{product.type}"
                ing_product_number: "{product.productNumber}"
                balance_source: "ing_live:product_balance"
                partial_data_suspected: "{product._partial_data_suspected}"
            as: metadata
          - apply: build_account
            args:
              institution: "{config.institution}"
              source_id: "{product.uuid}"
              currency: "{currency}"
              name: "{name}"
              type: loan
              portable_ref: "{portable_ref}"
              portable_id: "{portable_id}"
              balance: { current: "{balance_amount}", timestamp: null }
              metadata: "{metadata}"
            as: account
          - apply: parse_date
            args: { value: "{product.nextPayOffDate}", formats: "{config.ing_date_formats}" }
            as: due_date
          - apply: compact
            args:
              hash:
                ing_product_type: "{product.type}"
                ing_product_number: "{product.productNumber}"
                initial_amount: "{product.initialAmount}"
                pending_amount: "{product.pendingAmount}"
                pending_payments: "{product.pendingPayments}"
                next_pay_off_amount: "{product.nextPayOffAmount}"
                tin: "{product.tin}"
                tae: "{product.tae}"
                end_date: "{product.endDate}"
            as: liability_metadata
          - apply: build_liability
            args:
              account_id: "{account.id}"
              type: loan
              currency: "{account.currency}"
              source_id: "{product.uuid}"
              due_date: "{due_date}"
              metadata: "{liability_metadata}"
            as: liability
          - yield: { account: "{account}", liability: "{liability}" }

      # ---- combine ----
      - apply: pluck
        args: { list: "{liability_results}", key: account }
        as: card_accounts
      - apply: pluck
        args: { list: "{liability_results}", key: liability }
        as: card_liabilities
      - apply: pluck
        args: { list: "{loan_results}", key: account }
        as: loan_accounts
      - apply: pluck
        args: { list: "{loan_results}", key: liability }
        as: loan_liabilities
      - concat: [checking_accounts, card_accounts, loan_accounts]
        as: accounts
      - concat: [card_liabilities, loan_liabilities]
        as: liabilities

      # ================= TRANSACTIONS =================
      # One uniform pass over every built account (source_id = the product's
      # local uuid); movements live in the side map keyed by that uuid. A raw
      # /v2/search row is translated to canonical fields inline — coalesce
      # picks the v2 field, falling back to a legacy-shaped field so replayed
      # pre-migration payloads still normalize. Rows missing a stable id
      # (transactionId → v2-seq) drop; zero/garbage amounts drop.
      - for_each: { source: accounts }
        as_item: account
        as: txn_groups
        do:
          - lookup: { from: movements_by_uuid, key: "{account.source_id}", default: [] }
            as: rows
          - for_each: { source: rows }
            as_item: mv
            as: account_txns
            do:
              - apply: join_present
                args:
                  parts: ["v2-seq", "{mv.transactionId.productId}", "{mv.transactionId.transactionSequence}"]
                  separator: ":"
                as: v2_uuid
              - let: uuid
                coalesce: ["{mv.uuid}", "{v2_uuid}"]
              - skip_when: { uuid: { absent: true } }
              - apply: cents
                args: { amount: "{mv.amount}" }
                as: amount_cents
              - skip_when: { amount_cents: { absent: true } }
              - skip_when: { amount_cents: { eq: 0 } }
              - apply: cents_to_amount
                args: { cents: "{amount_cents}" }
                as: amount
              - apply: reformat_date
                args: { value: "{mv.transactionDate}", from: "%Y-%m-%d", to: "%d/%m/%Y" }
                as: v2_date
              - let: effective_date
                coalesce: ["{mv.effectiveDate}", "{v2_date}"]
              - apply: parse_date
                args: { value: "{effective_date}", formats: "{config.ing_date_formats}" }
                as: date
              - skip_when: { date: { absent: true } }
              - let: store
                coalesce: ["{mv.store}", "{mv.concept}"]
              - let: tran_code
                coalesce: ["{mv.tranCode}", "{mv.transactionCode}"]
              - let: currency
                coalesce: ["{mv.currency}", "EUR"]
              - apply: parse_date
                args: { value: "{mv.clearingDate}", formats: "{config.ing_date_formats}" }
                as: value_date
              # description = stripped top line — whitespace-collapsed store
              # sub-line, joined " — " (the store carries the per-line
              # disambiguator: kid's name, meter number, SEPA reference).
              - apply: strip
                args: { value: "{mv.description}" }
                as: desc_stripped
              - apply: compact_whitespace
                args: { value: "{store}" }
                as: store_cw
              - apply: join
                args: { parts: ["{desc_stripped}", "{store_cw}"], separator: " — ", drop_empty: true }
                as: description
              - apply: map_status
                args: { value: "{mv.status.description}", mapping: "{config.status_map}" }
                as: mapped_status
              - let: status
                coalesce: ["{mapped_status}", "posted"]
              # metadata.ing = the config-declared raw-field allowlist over
              # the translated shape (nil for fields a /search row omits).
              - apply: extract_fields
                args:
                  source:
                    uuid: "{uuid}"
                    amount: "{amount}"
                    effectiveDate: "{effective_date}"
                    description: "{mv.description}"
                    store: "{store}"
                    tranCode: "{tran_code}"
                  mapping: "{config.raw_fields_movement}"
                as: ing_metadata
              - apply: build_transaction
                args:
                  account_id: "{account.id}"
                  source_id: "{uuid}"
                  amount: "{amount}"
                  currency: "{currency}"
                  date: "{date}"
                  value_date: "{value_date}"
                  description: "{description}"
                  raw_description: "{description}"
                  status: "{status}"
                  metadata: { ing: "{ing_metadata}" }
                as: txn
              - yield: "{txn}"
          - yield: "{account_txns}"
      - apply: flatten
        args: { list: "{txn_groups}" }
        as: all_transactions
      # Same-fetch pre-clearing dedup: ING re-emits one posting under two
      # sequences while a charge settles (terse → enriched description).
      # Drop the terse row when it's a strict prefix of the enriched one.
      - apply: collapse_prefix_dups
        args:
          rows: "{all_transactions}"
          group_by: [account_id, date, amount]
          text: description
        as: transactions

    output:
      accounts: "{accounts}"
      transactions: "{transactions}"
      liabilities: "{liabilities}"
