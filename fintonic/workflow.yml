version: 1

config:
  key: fintonic
  default_lookback_days: 365

secrets:
  USER_EMAIL:
    prompt: "Fintonic email"
  USER_PIN:
    prompt: "Fintonic 4-digit PIN"

pipeline:
  - connect
  - login
  - approve_2fa
  - post_login
  - capture_credentials
  # - investigate  # uncomment for debugging

phases:
  connect:
    - action: navigate
      url: "https://www.fintonic.com/private/login"
    - action: wait_network_idle
      seconds: 3

  login:
    # Dismiss cookie banner
    - action: click_if_present
      selector: "button#CybotCookiebotDialogBodyButtonAccept"

    # Detect which page we land on: email, PIN, or straight to 2FA
    - action: wait_for_first_of
      selectors:
        - "input#usernameForm"
        - "input#password0"
        - "input.MuiInputBase-input.MuiInput-input"
      timeout: 15

    # Step 1: Email (skipped if remembered)
    - action: fill_if_present
      selector: "input#usernameForm"
      value: "secret(USER_EMAIL)"
    - action: click_if_present
      selector: "body:has(#usernameForm) #loginButton"

    # Step 2: 4-digit PIN (skipped if session goes straight to 2FA)
    - action: fill_if_present
      selector: "input#password0"
      value: "secret(USER_PIN[0])"
    - action: fill_if_present
      selector: "input#password1"
      value: "secret(USER_PIN[1])"
    - action: fill_if_present
      selector: "input#password2"
      value: "secret(USER_PIN[2])"
    - action: fill_if_present
      selector: "input#password3"
      value: "secret(USER_PIN[3])"
    - action: click_if_present
      selector: "button#passwordButton"
    - action: wait_network_idle
      seconds: 3

  approve_2fa:
    # Since ~May 2026 the SMS challenge lives on its own page,
    # /private/verify, with a single numeric input. The previous
    # design (inline MUI dialog on /private/login) is gone; the
    # MuiInputBase / MuiButton-containedPrimary selectors no longer
    # match anything. We wait for the verify URL, then for the
    # numeric input, then prompt + fill + submit.
    - action: wait_url
      includes: "/private/verify"
      timeout: 30
    - action: wait_for_selector
      selector: "input[type=\"number\"]"
      timeout: 30
    - action: prompt_stdin_and_fill
      selector: "input[type=\"number\"]"
      prompt: "Enter the SMS code Fintonic sent to your phone: "
      timeout: 300
    # Submit. The /private/verify page renders a plain `<button>Entrar</button>`
    # inside `<div class="buttons mt20">` — no explicit `type=submit`,
    # no stable class on the button itself, and React enables it
    # asynchronously after the SMS code is fully accepted into state.
    #
    # A previous version used `section button:not([disabled])`. That
    # selector matched the FIRST enabled button anywhere in the
    # /private/verify <section> — which wraps the page's onboarding
    # header containing always-enabled buttons (help icon, user
    # avatar). The wait returned immediately on the header button,
    # the click hit it instead of "Entrar", the verify form was
    # never actually submitted, and Fintonic eventually bounced the
    # session back to PIN with "código incorrecto" because no code
    # ever reached the verify endpoint.
    #
    # Fix: scope by the form's `.buttons` container (one button only)
    # AND target by visible text via click_text. Both layers of
    # defense — anything that ever rearranges this page can break
    # at most one of them.
    - action: wait_for_selector
      selector: "div.buttons button:not([disabled])"
      timeout: 30
    - action: click_text
      role: button
      text: "Entrar"
      within: "div.buttons"
      match: exact
      timeout: 10
    # After 2FA Fintonic redirects to the main private area; let
    # the network settle before post_login navigates away. (wait_url
    # would be satisfied immediately by /private/verify itself,
    # since `includes:` is a substring match.)
    - action: wait_network_idle
      seconds: 5

  post_login:
    # Navigate to a page that triggers API calls so we can capture the token.
    - action: navigate
      url: "https://www.fintonic.com/private/transactions"
    - action: wait_network_idle
      seconds: 8

  capture_credentials:
    - action: capture_header
      name: "Authorization"
      as: bearer_token
      retries: 5
      interval_seconds: 2

  investigate:
    - action: record_requests
      url_matches:
        - "api.fintonic.com"
      include_response_body: true
      max_body_bytes: 131072

    - action: navigate
      url: "https://www.fintonic.com/private/transactions"
    - action: wait_network_idle
      seconds: 5

    - action: navigate
      url: "https://www.fintonic.com/private/accounts"
    - action: wait_network_idle
      seconds: 5

    - action: dump_requests
      path: "/tmp/fintonic_capture.ndjson"
      format: "ndjson"
      reset: true

    - action: pause
      message: "Navigate to any other pages you want to capture, then press Enter."
      timeout: 600

    - action: dump_requests
      path: "/tmp/fintonic_explore.ndjson"
      format: "ndjson"

credentials:
  require:
    - bearer_token
  validate:
    - key: bearer_token
      not_empty: true
      contains: "Bearer "
  map:
    - { from: bearer_token, as: bearer_token }

api_client:
  base_url: "https://api.fintonic.com"
  api_root: "/finapi/rest"
  credentials: [bearer_token]
  auth_headers:
    Authorization: "{bearer_token}"
    Accept:        "application/vnd.fintonic-v7+json"
    psd2_support:  "true"
  date_format: "%Y-%m-%d"
  # The transaction endpoints wrap their rows in {"count":N,"resultList":[…]}.
  # batch_keys drives the offset-pagination unwrap on fetch_transactions;
  # the single-shot fetch_unread_transactions unwraps via its own
  # response.extract_batch below.
  batch_keys:
    - resultList
  endpoints:
    - name: fetch_date_range
      method: GET
      path: "/transaction/olderNewerTransactionUserDate"
    - name: fetch_categories
      method: GET
      path: "/category/tree"
    # Read transactions — offset-paginated by the framework. The loop
    # injects {offset} into pageOffset and stops on a short/empty page
    # (the same rows the old hand-written total-tracking loop produced;
    # it may issue one extra empty page when the total is an exact
    # multiple of the limit). beginDate/endDate are ISO-formatted from
    # whatever the plan binds (a Date or an ISO string) via |iso.
    - name: fetch_transactions
      method: GET
      path: "/transaction/list"
      pagination: offset
      limit: 100
      params:
        pageLimit:  100
        pageOffset: "{offset}"
        beginDate:  "{begin_date|iso}"
        endDate:    "{end_date|iso}"
        read:       "true"
    # Unread transactions — a single request (pageLimit -1 returns them
    # all), merged + deduped against the read set by the plan.
    - name: fetch_unread_transactions
      method: GET
      path: "/transaction/list"
      params:
        pageLimit:  -1
        pageOffset: 0
        beginDate:  "{begin_date|iso}"
        endDate:    "{end_date|iso}"
        read:       "false"
      response:
        extract_batch: [resultList]

# Pure orchestration — no extractor.rb. Coalesce the date range (the
# ArgumentError-free `from_date || olderTransactionUserDate || "2015-01-01"`),
# fetch read (paginated) + unread, concat, dedup by Fintonic id.
extract:
  plan:
    steps:
      - fetch: fetch_date_range
        as: date_range
        safe: true
        default: {}
      - fetch: fetch_categories
        as: raw_categories
        safe: true
        default: {}
      - select: { from: raw_categories, path: categoryTree, default: {} }
        as: categoryTree

      - let: begin_date
        coalesce: ["{from_date}", "{date_range.olderTransactionUserDate}", "2015-01-01"]
      - let: end_date
        coalesce: ["{date_range.newerTransactionUserDate}", "{today}"]

      - fetch: fetch_transactions
        args: { begin_date: "{begin_date}", end_date: "{end_date}" }
        as: read_txs
        safe: true
        default: []
      - fetch: fetch_unread_transactions
        args: { begin_date: "{begin_date}", end_date: "{end_date}" }
        as: unread_txs
        safe: true
        default: []

      - concat: [read_txs, unread_txs]
        as: all_txs
      - dedup_by: id
        from: all_txs
        as: transactions
    output:
      categoryTree: "{categoryTree}"
      transactions: "{transactions}"

normalize:
  ruby: ./normalizer.rb
  class: Freentonic::Providers::Fintonic::Normalizer
