version: 1

config:
  key: unicaja
  default_lookback_days: 30
  error_signals:
    - text: "Ha ocurrido un error. Por favor, inténtelo de nuevo más tarde"
      message: "Cybersecurity blocked the login attempt"
    - selector: "div[data-testid='snackbar-fixed-container'] div[mode='WARNING']"
      message: "Cybersecurity blocked the login attempt"

secrets:
  USER_LOGIN:
    prompt: "Unicaja user / DNI"
  USER_PASSWORD:
    prompt: "Unicaja password"

pipeline:
  - connect
  - dismiss_cookie_banner
  - login
  - post_login
  - pre_arm_history
  - capture_credentials

phases:
  connect:
    - action: navigate
      url: "https://univia.unicajabanco.es/login"
    - action: wait_url
      includes: "univia"
      timeout: 15
  dismiss_cookie_banner:
    - action: wait
      seconds: 5
    - action: wait_for_first_of
      selectors:
        - "#onetrust-pc-btn-handler"
        - "input#username"
      timeout: 30
    - action: simulate_human
      duration: 3
    - action: click_if_present
      selector: "#onetrust-pc-btn-handler"
    - action: click_if_present
      selector: ".ot-pc-refuse-all-handler"
  login:
    - action: wait_for_selector
      selector: "input#username"
      timeout: 15
    - action: fill
      selector: "input#username"
      value: "secret(USER_LOGIN)"
    - action: fill
      selector: "input#pwd"
      value: "secret(USER_PASSWORD)"
    - action: click
      selector: "button[type='submit']"
    - action: wait_url
      includes: "posicion-global"
      timeout: 120
  post_login:
    - action: wait_network_idle
      seconds: 5
  # Arms the session so the /apis/externo/.../busqueda endpoint will return
  # history older than ~30 days. Unicaja requires a UI-driven search with a
  # far-back from-date that triggers an SMS OTP, which the user types in.
  # Every step is gated on lookback_days > 30 — for short runs the whole
  # phase is silently skipped and we fall through to capture_credentials.
  pre_arm_history:
    - action: click
      selector: "a[data-testid='wrapper-card-sLink'][href*='/cuentas/'][href$='/movimientos']"
      when_context: { lookback_days: { gt: 30 } }
    - action: wait_url
      includes: "/movimientos"
      timeout: 30
      when_context: { lookback_days: { gt: 30 } }
    # wait_url fires as soon as the URL matches, but React is still
    # hydrating — clicking too early leaves the click event with no
    # handler attached, so the button looks clicked but nothing happens.
    # Let the page go idle before we try to interact with it.
    - action: wait_network_idle
      seconds: 3
      when_context: { lookback_days: { gt: 30 } }
    # Opens the "Buscar movimientos" action sheet. Scoped to the
    # movements content container just in case; diagnostic confirmed
    # only one Buscar button is reachable so the scope is belt-and-
    # suspenders, not strictly required.
    - action: click_text
      text: "Buscar"
      role: button
      within: "div[class*='BlockMovements']"
      timeout: 30
      when_context: { lookback_days: { gt: 30 } }
    # Give the action sheet a beat to mount + animate open before we
    # start polling for its inputs.
    - action: wait
      seconds: 1
      when_context: { lookback_days: { gt: 30 } }
    - action: wait_for_selector
      selector: "input[name='dateFrom']"
      timeout: 15
      when_context: { lookback_days: { gt: 30 } }
    # Sentinel from-date: must be >30 days ago (to trigger the OTP) AND
    # ≤18 months ago (the form's client-side max range — older dates
    # are rejected as "Fecha fuera de rango"). 01/04/2025 gives ~12
    # months on the 2026-04-11 baseline, leaving headroom on both sides.
    # TODO: when this date creeps past the 18-month limit (mid-2026),
    # either bump it or add a framework template filter like
    # `{months_ago|12|date}` to compute it dynamically.
    # clear: true resets the React-controlled pre-filled value before
    # typing so we replace instead of append.
    - action: fill
      selector: "input[name='dateFrom']"
      value: "01/04/2025"
      clear: true
      when_context: { lookback_days: { gt: 30 } }
    - action: click_text
      text: "Buscar movimientos"
      role: button
      within: "div[class*='StyledActionSheetDesktop']"
      timeout: 15
      when_context: { lookback_days: { gt: 30 } }
    # After the action sheet submits, the movements list re-renders
    # with a "Autorizar consulta" consent button — clicking it is
    # what actually triggers the SMS OTP. Without this click, no code
    # is sent and nothing prompts the user. Scoped to the results
    # container so we don't match any stray accept buttons elsewhere.
    - action: wait_network_idle
      seconds: 3
      when_context: { lookback_days: { gt: 30 } }
    - action: click_text
      text: "Autorizar consulta"
      role: button
      within: "div[class*='BlockCardsMovements']"
      timeout: 30
      when_context: { lookback_days: { gt: 30 } }
    # Wait for the "Clave de seguridad" dialog (StyledActionSheetDesktop
    # titled "Ver movimientos") to mount and its 6-digit input to
    # render. The field is a tel input with autocomplete="one-time-code".
    - action: wait_for_selector
      selector: "input[data-testid='InputSecurityCode']"
      timeout: 60
      when_context: { lookback_days: { gt: 30 } }
    # Prompt the user for the SMS code and type it into the input.
    # No submit_selector here: the "Firmar" button starts disabled and
    # React only enables it after 6 digits land in state, so we wait
    # for the :not([disabled]) state explicitly below before clicking.
    - action: prompt_stdin_and_fill
      selector: "input[data-testid='InputSecurityCode']"
      prompt: "Enter the SMS code Unicaja sent you: "
      timeout: 300
      when_context: { lookback_days: { gt: 30 } }
    - action: wait_for_selector
      selector: "button[data-testid='signatureModal-button-submit']:not([disabled])"
      timeout: 10
      when_context: { lookback_days: { gt: 30 } }
    - action: click
      selector: "button[data-testid='signatureModal-button-submit']"
      when_context: { lookback_days: { gt: 30 } }
    - action: wait_network_idle
      seconds: 3
      when_context: { lookback_days: { gt: 30 } }
  capture_credentials:
    - action: reload
    - action: wait
      seconds: 4
    - action: capture_header
      name: "tokencsrf"
      as: "tokencsrf"
      retries: 3
      interval_seconds: 2
    - action: capture_cookie_header
      host: "univia.unicajabanco.es"
      path: "/services/rest/"
      as: "cookie"

credentials:
  require:
    - cookie
    - tokencsrf
  map:
    - from: cookie
      as: cookie
    - from: tokencsrf
      as: tokencsrf

api_client:
  base_url: "https://univia.unicajabanco.es"
  # No api_root — endpoints span two path prefixes:
  #   /services/rest/api  (standard endpoints)
  #   /apis/externo       (extended-history busqueda, requires OTP arming)
  expected_content_type: "application/json"
  credentials:
    keys: [cookie, tokencsrf]
    required: true
  batch_keys:
    - movimientos
    - listaMovimientos
  date_format: "%Y-%m-%d"
  auth_headers:
    Cookie:          "{cookie}"
    tokencsrf:       "{tokencsrf}"
    Accept:          "application/json, text/plain, */*"
    Accept-Language: "es-ES,es;q=0.9"
    Origin:          "https://univia.unicajabanco.es"
    Referer:         "https://univia.unicajabanco.es/posicion-global"
  endpoints:
    - name: fetch_listacuentas
      method: GET
      path: "/services/rest/api/productos/listacuentas"
    - name: fetch_listatarjetas
      method: GET
      path: "/services/rest/api/productos/listatarjetas"
    - name: fetch_listaprestamos
      method: GET
      path: "/services/rest/api/productos/listaprestamos"
    # Standard movements endpoint — works for the last ~30 days without
    # OTP arming.  Always used for the recent-window fetch.
    - name: fetch_all_account_movements
      method: POST
      path: "/services/rest/api/cuentas/movimientos"
      form:
        ppp:        "{ppp}"
        fechaDesde: "{fecha_desde|date}"
        impDesde:   "0"
      response:
        extract_batch: [movimientos, listaMovimientos]
    # Extended-history endpoint — requires the session to be armed via
    # pre_arm_history (OTP). Cursor-paginated declaratively: the loop
    # sends indOperacion=I on the first call (no cursor) and indOperacion=P
    # plus the saldoUltMov / numUltMov cursor on every continuation,
    # reading both values out of the previous response's masMovimientos
    # envelope. Stops when masMovimientos.indMasMovimientos != "S" or
    # either cursor field is missing.
    - name: fetch_extended_account_movements
      method: POST
      path: "/apis/externo/unicaja/banca-digital/cuentas/movimientos/busqueda"
      form:
        ppp:          "{ppp}"
        indOperacion: "{ind_operacion}"
        fechaDesde:   "{fecha_desde|date}"
        fechaHasta:   "{fecha_hasta|date}"
        tipologia:    "T"
        saldoUltMov:  "{saldo_ult_mov}"
        numUltMov:    "{num_ult_mov}"
      pagination:
        kind: cursor
        initial_kwargs:  { ind_operacion: "I" }
        continue_kwargs: { ind_operacion: "P" }
        cursor_from_response:
          saldo_ult_mov: masMovimientos.ultimoSaldo.cantidad
          num_ult_mov:   masMovimientos.numUltimoMovimiento
        continue_when:
          response_path: masMovimientos.indMasMovimientos
          equals: "S"
      response:
        extract_batch: [movimientos, listaMovimientos]
    - name: fetch_all_card_movements
      method: POST
      path: "/services/rest/api/tarjetas/movimientos/listadoMovimientos/v2"
      form:
        ppp:        "{ppp}"
        fechaDesde: "{fecha_desde|date}"
        impDesde:   "0"
      response:
        extract_batch: [movimientos, listaMovimientos]

# Pure orchestration — no extractor.rb. The credit-vs-debit card filter is
# NOT here: it's the normalize plan's job (skip_when codtipotarjeta != "2").
# This plan fetches movements for every tarjeta; the normalize plan drops the
# debit accounts (and never reads their movements), so the output is unchanged.
extract:
  plan:
    steps:
      - fetch: fetch_listacuentas
        as: raw_cuentas
      - select: { from: raw_cuentas, path: [cuentas, listaCuentas], default: [] }
        as: cuentas

      - fetch: fetch_listatarjetas
        as: raw_tarjetas
      - select: { from: raw_tarjetas, path: [tarjetas, listaTarjetas], default: [] }
        as: tarjetas

      - fetch: fetch_listaprestamos
        as: raw_prestamos
        safe: true
        default: {}
      - select: { from: raw_prestamos, path: prestamos, default: [] }
        as: prestamos_own
      - select: { from: raw_prestamos, path: prestamosAvalados, default: [] }
        as: prestamos_avalados
      - concat: [prestamos_own, prestamos_avalados]
        as: prestamos

      # recent_from = extended ? (today - 30) : from_date, where
      # extended == lookback_days > 30. Two lets: the default, then the
      # gated override — the second only binds when the gate holds.
      - let: recent_from
        value: "{from_date}"
      - let: recent_from
        days_ago: 30
        when: { lookback_days: { gt: 30 } }

      # Per-cuenta movements. Standard fetch always runs (recent window);
      # the extended-history fetch runs only on long lookbacks (>30 days,
      # the OTP-armed session) and is merged in, deduping the overlap
      # across the two endpoints' field spellings (numMovimiento vs nummov,
      # nil key → kept).
      - for_each:
          source: cuentas
        as_item: cuenta
        as: cuenta_movements
        collect: map
        key: "{ppp}"
        do:
          - select: { from: cuenta, path: [ppp, codigoProducto] }
            as: ppp
          - fetch: fetch_all_account_movements
            args: { ppp: "{ppp}", fecha_desde: "{recent_from}" }
            as: recent
            safe: true
            default: []
            when: { ppp: { present: true } }
          - fetch: fetch_extended_account_movements
            args: { ppp: "{ppp}", fecha_desde: "{from_date}", fecha_hasta: "{recent_from}" }
            as: old
            safe: true
            default: []
            when: { lookback_days: { gt: 30 }, ppp: { present: true } }
          - concat: [old, recent]
            as: merged
          - dedup_by: [numMovimiento, nummov]
            from: merged
            as: movements
          - yield: "{movements}"
            skip_if_nil: ppp

      # Per-tarjeta movements, keyed by ppp. Fetched for every card; the
      # normalizer keeps only credit cards (see the header note).
      - for_each:
          source: tarjetas
        as_item: tarjeta
        as: tarjeta_movements
        collect: map
        key: "{ppp}"
        do:
          - select: { from: tarjeta, path: [ppp, codigoProducto] }
            as: ppp
          - fetch: fetch_all_card_movements
            args: { ppp: "{ppp}", fecha_desde: "{from_date}" }
            as: movements
            safe: true
            default: []
            when: { ppp: { present: true } }
          - yield: "{movements}"
            skip_if_nil: ppp
    output:
      cuentas: "{cuentas}"
      tarjetas: "{tarjetas}"
      prestamos: "{prestamos}"
      cuenta_movements: "{cuenta_movements}"
      tarjeta_movements: "{tarjeta_movements}"

normalize:
  plan:
    steps:
      - select: { from: raw, path: cuentas, default: [] }
        as: cuentas
      - select: { from: raw, path: tarjetas, default: [] }
        as: tarjetas
      - select: { from: raw, path: prestamos, default: [] }
        as: prestamos
      - select: { from: raw, path: cuenta_movements, default: {} }
        as: cuenta_movements
      - select: { from: raw, path: tarjeta_movements, default: {} }
        as: tarjeta_movements
      # Loan-type dispatch: indPrestamoHipotecario == "S" → mortgage, else
      # loan. Equality-only — a real-data audit showed the flag is
      # authoritative (a mortgage can carry a "PR. LIBRES" description), so
      # the old description string-match fallback is dropped.
      - let: loan_type_map
        value: { S: mortgage }

      # ================= CUENTAS → checking accounts (+ movements) =========
      - for_each: { source: cuentas }
        as_item: cuenta
        as: cuenta_results
        do:
          - apply: pick
            args: { key: ppp, source: "{cuenta}", aliases: "{config.field_aliases}" }
            as: ppp
          - skip_when: { ppp: { absent: true } }
          - apply: pick
            args: { key: iban, source: "{cuenta}", aliases: "{config.field_aliases}" }
            as: iban
          - apply: spanish_iban_portable_keys
            args: { iban: "{iban}", bank_code: "{config.bank_code}" }
            as: portable
          - apply: pick
            args: { key: balance, source: "{cuenta}", aliases: "{config.field_aliases}" }
            as: balance_raw
          - apply: cents
            args: { amount: "{balance_raw}" }
            as: balance_cents
          - apply: cents_to_amount
            args: { cents: "{balance_cents}" }
            as: balance_amount
          - apply: pick
            args: { key: currency, source: "{cuenta}", aliases: "{config.field_aliases}" }
            as: cuenta_currency
          - let: currency
            coalesce: ["{cuenta_currency}", "EUR"]
          - apply: join
            args: { parts: ["Unicaja ", "{ppp}"] }
            as: default_name
          - apply: first_present
            args: { candidates: ["{cuenta.alias}", "{cuenta.descripcion}", "{default_name}"] }
            as: name
          - apply: join
            args: { parts: ["cuenta:", "{ppp}"] }
            as: source_id
          - apply: build_account
            args:
              institution: "{config.institution}"
              source_id: "{source_id}"
              currency: "{currency}"
              name: "{name}"
              type: checking
              iban: "{iban}"
              portable_ref: "{portable.0}"
              portable_id: "{portable.1}"
              balance: { current: "{balance_amount}", timestamp: null }
              metadata:
                unicaja_ppp: "{ppp}"
                unicaja_kind: cuenta
                balance_source: "unicaja_live:listacuentas"
            as: account
          - lookup: { from: cuenta_movements, key: "{ppp}", default: [] }
            as: rows
          - for_each: { source: rows }
            as_item: mv
            as: txns
            do:
              - apply: pick
                args: { key: movement_id, source: "{mv}", aliases: "{config.field_aliases}" }
                as: mv_id
              - skip_when: { mv_id: { absent: true } }
              - apply: pick
                args: { key: raw_amount, source: "{mv}", aliases: "{config.field_aliases}" }
                as: raw_amount
              - apply: cents
                args: { amount: "{raw_amount}" }
                as: amount_cents
              - skip_when: { amount_cents: { absent: true } }
              - skip_when: { amount_cents: { eq: 0 } }
              - apply: cents_to_amount
                args: { cents: "{amount_cents}" }
                as: amount
              - apply: pick
                args: { key: date, source: "{mv}", aliases: "{config.field_aliases}" }
                as: date_raw
              - apply: parse_date
                args: { value: "{date_raw}", formats: "{config.unicaja_date_formats}" }
                as: date
              - skip_when: { date: { absent: true } }
              - apply: pick
                args: { key: currency, source: "{raw_amount}", aliases: "{config.field_aliases}" }
                as: cur_from_amount
              - apply: pick
                args: { key: currency, source: "{mv}", aliases: "{config.field_aliases}" }
                as: cur_from_mv
              - let: mv_currency
                coalesce: ["{cur_from_amount}", "{cur_from_mv}", "{account.currency}"]
              - apply: pick
                args: { key: description, source: "{mv}", aliases: "{config.field_aliases}" }
                as: description_pick
              - apply: strip
                args: { value: "{description_pick}" }
                as: description
              - apply: pick
                args: { key: description_raw, source: "{mv}", aliases: "{config.field_aliases}" }
                as: raw_description
              - apply: build_transaction
                args:
                  account_id: "{account.id}"
                  source_id: "{mv_id}"
                  amount: "{amount}"
                  currency: "{mv_currency}"
                  date: "{date}"
                  description: "{description}"
                  raw_description: "{raw_description}"
                  metadata: { unicaja_movement: "{mv}", ppp: "{ppp}" }
                as: txn
              - yield: "{txn}"
          - yield: { account: "{account}", txns: "{txns}" }

      # ================= TARJETAS → credit-card accounts (+ liability, mvmts)
      # Only codtipotarjeta == "2" is a credit card; debit cards
      # (codtipotarjeta "1", e.g. "MC DÉBITO DIFERIDO") are dropped. Equality
      # -only, confirmed against a real listatarjetas dump.
      - for_each: { source: tarjetas }
        as_item: tarjeta
        as: tarjeta_results
        do:
          - select: { from: tarjeta, path: codtipotarjeta }
            as: codtipotarjeta
          - skip_when: { codtipotarjeta: { neq: "2" } }
          - apply: pick
            args: { key: ppp, source: "{tarjeta}", aliases: "{config.field_aliases}" }
            as: ppp
          - skip_when: { ppp: { absent: true } }
          - let: pan
            coalesce: ["{tarjeta.numtarjeta}", "{tarjeta.numeroTarjeta}"]
          - apply: card_pan_portable_keys
            args: { pan: "{pan}", bank_code: "{config.bank_code}" }
            as: portable
          # Outstanding = limite − disponible (major units) → cents.
          - apply: subtract
            args: { a: "{tarjeta.limite.cantidad}", b: "{tarjeta.disponible.cantidad}" }
            as: outstanding
          - apply: cents
            args: { amount: "{outstanding}" }
            as: outstanding_cents
          - apply: negate
            args: { value: "{outstanding_cents}" }
            as: balance_cents
          - apply: cents_to_amount
            args: { cents: "{balance_cents}" }
            as: balance_amount
          - apply: cents_to_amount
            args: { cents: "{outstanding_cents}" }
            as: liability_balance
          - apply: cents
            args: { amount: "{tarjeta.limite.cantidad}" }
            as: limit_cents
          - apply: cents_to_amount
            args: { cents: "{limit_cents}" }
            as: liability_limit
          - apply: pick
            args: { key: currency, source: "{tarjeta}", aliases: "{config.field_aliases}" }
            as: tarjeta_currency
          - let: currency
            coalesce: ["{tarjeta_currency}", "EUR"]
          - apply: join
            args: { parts: ["Unicaja card ", "{ppp}"] }
            as: default_name
          - apply: first_present
            args:
              candidates: ["{tarjeta.alias}", "{tarjeta.tipotarjeta}", "{default_name}", "{tarjeta.descripcion}"]
            as: name
          - apply: join
            args: { parts: ["tarjeta:", "{ppp}"] }
            as: source_id
          - apply: build_account
            args:
              institution: "{config.institution}"
              source_id: "{source_id}"
              currency: "{currency}"
              name: "{name}"
              type: credit_card
              portable_ref: "{portable.0}"
              portable_id: "{portable.1}"
              balance: { current: "{balance_amount}", timestamp: null }
              metadata:
                unicaja_ppp: "{ppp}"
                unicaja_kind: tarjeta
                unicaja_codtipotarjeta: "{tarjeta.codtipotarjeta}"
                balance_source: "unicaja_live:listatarjetas"
            as: account
          - apply: build_liability
            args:
              account_id: "{account.id}"
              type: credit_card
              currency: "{account.currency}"
              source_id: "{source_id}"
              balance: "{liability_balance}"
              limit: "{liability_limit}"
              metadata:
                unicaja_codtipotarjeta: "{tarjeta.codtipotarjeta}"
            as: liability
          - lookup: { from: tarjeta_movements, key: "{ppp}", default: [] }
            as: rows
          - for_each: { source: rows }
            as_item: mv
            as: txns
            do:
              - apply: pick
                args: { key: movement_id, source: "{mv}", aliases: "{config.field_aliases}" }
                as: mv_id
              - skip_when: { mv_id: { absent: true } }
              - apply: pick
                args: { key: raw_amount, source: "{mv}", aliases: "{config.field_aliases}" }
                as: raw_amount
              - apply: cents
                args: { amount: "{raw_amount}" }
                as: amount_cents
              - skip_when: { amount_cents: { absent: true } }
              - skip_when: { amount_cents: { eq: 0 } }
              - apply: cents_to_amount
                args: { cents: "{amount_cents}" }
                as: amount
              - apply: pick
                args: { key: date, source: "{mv}", aliases: "{config.field_aliases}" }
                as: date_raw
              - apply: parse_date
                args: { value: "{date_raw}", formats: "{config.unicaja_date_formats}" }
                as: date
              - skip_when: { date: { absent: true } }
              - apply: pick
                args: { key: currency, source: "{raw_amount}", aliases: "{config.field_aliases}" }
                as: cur_from_amount
              - apply: pick
                args: { key: currency, source: "{mv}", aliases: "{config.field_aliases}" }
                as: cur_from_mv
              - let: mv_currency
                coalesce: ["{cur_from_amount}", "{cur_from_mv}", "{account.currency}"]
              - apply: pick
                args: { key: description, source: "{mv}", aliases: "{config.field_aliases}" }
                as: description_pick
              - apply: strip
                args: { value: "{description_pick}" }
                as: description
              - apply: pick
                args: { key: description_raw, source: "{mv}", aliases: "{config.field_aliases}" }
                as: raw_description
              - apply: build_transaction
                args:
                  account_id: "{account.id}"
                  source_id: "{mv_id}"
                  amount: "{amount}"
                  currency: "{mv_currency}"
                  date: "{date}"
                  description: "{description}"
                  raw_description: "{raw_description}"
                  metadata: { unicaja_movement: "{mv}", ppp: "{ppp}" }
                as: txn
              - yield: "{txn}"
          - yield: { account: "{account}", liability: "{liability}", txns: "{txns}" }

      # ================= PRESTAMOS → loan accounts (+ liability) ===========
      # Balance-only (no movements). Loans set no portable_ref, so the id
      # falls back to (institution, source_id).
      - for_each: { source: prestamos }
        as_item: prestamo
        as: prestamo_results
        do:
          - select: { from: prestamo, path: ppp }
            as: ppp
          - skip_when: { ppp: { absent: true } }
          - lookup: { from: loan_type_map, key: "{prestamo.indPrestamoHipotecario}", default: loan }
            as: loan_type
          - apply: cents
            args: { amount: "{prestamo.saldo.cantidad}" }
            as: balance_cents
          - apply: cents_to_amount
            args: { cents: "{balance_cents}" }
            as: balance_amount
          - let: currency
            coalesce: ["{prestamo.saldo.moneda}", "EUR"]
          - apply: join
            args: { parts: ["Unicaja loan ", "{ppp}"] }
            as: default_name
          - apply: first_present
            args: { candidates: ["{prestamo.alias}", "{prestamo.descripcion}", "{default_name}"] }
            as: name
          - apply: join
            args: { parts: ["prestamo:", "{ppp}"] }
            as: source_id
          - apply: build_account
            args:
              institution: "{config.institution}"
              source_id: "{source_id}"
              currency: "{currency}"
              name: "{name}"
              type: loan
              balance: { current: "{balance_amount}", timestamp: null }
              metadata:
                unicaja_ppp: "{ppp}"
                unicaja_kind: prestamo
                unicaja_loan_type: "{loan_type}"
                balance_source: "unicaja_live:listaprestamos"
            as: account
          - apply: build_liability
            args:
              account_id: "{account.id}"
              type: "{loan_type}"
              currency: "{account.currency}"
              source_id: "{source_id}"
              balance: "{balance_amount}"
              metadata:
                unicaja_loan_type: "{loan_type}"
            as: liability
          - yield: { account: "{account}", liability: "{liability}" }

      # ================= combine =================
      - apply: pluck
        args: { list: "{cuenta_results}", key: account }
        as: cuenta_accounts
      - apply: pluck
        args: { list: "{cuenta_results}", key: txns }
        as: cuenta_txn_groups
      - apply: pluck
        args: { list: "{tarjeta_results}", key: account }
        as: tarjeta_accounts
      - apply: pluck
        args: { list: "{tarjeta_results}", key: liability }
        as: tarjeta_liabilities
      - apply: pluck
        args: { list: "{tarjeta_results}", key: txns }
        as: tarjeta_txn_groups
      - apply: pluck
        args: { list: "{prestamo_results}", key: account }
        as: prestamo_accounts
      - apply: pluck
        args: { list: "{prestamo_results}", key: liability }
        as: prestamo_liabilities
      - concat: [cuenta_accounts, tarjeta_accounts, prestamo_accounts]
        as: accounts
      - concat: [tarjeta_liabilities, prestamo_liabilities]
        as: liabilities
      - apply: flatten
        args: { list: "{cuenta_txn_groups}" }
        as: cuenta_transactions
      - apply: flatten
        args: { list: "{tarjeta_txn_groups}" }
        as: tarjeta_transactions
      - concat: [cuenta_transactions, tarjeta_transactions]
        as: transactions

    output:
      accounts: "{accounts}"
      transactions: "{transactions}"
      liabilities: "{liabilities}"
