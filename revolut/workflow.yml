version: 1

config:
  key: revolut
  default_lookback_days: 90

secrets:
  USER_EMAIL:
    prompt: "Revolut email address"
  USER_PASSCODE:
    prompt: "Revolut passcode (6-digit PIN)"

pipeline:
  - connect
  - login
  - approve_2fa
  - post_login
  - capture_credentials

phases:
  connect:
    - action: navigate
      url: "https://app.revolut.com/home"
    # Three possible states after navigation:
    #   1. SSO fresh login — "Continue with email" button visible
    #   2. SSO remembered email — passcode input visible directly
    #   3. Already logged in — stays at app.revolut.com/home
    # All SSO states land on sso.revolut.com; logged-in stays on
    # app.revolut.com. Just wait for the page to settle.
    - action: wait_network_idle
      seconds: 3

  login:
    # If already logged in, these _if_present actions are no-ops.
    # If on SSO, click "Email", fill credentials, approve on phone.
    - action: click_if_present
      selector: "button[aria-label='Continue with email']"
    - action: fill_if_present
      selector: "input[type='email'], input[name='email'], input[autocomplete='email']"
      value: "secret(USER_EMAIL)"
    - action: click_if_present
      selector: "button[type='submit']"
    # Passcode auto-submits after 6 digits — no Continue button needed.
    - action: fill_if_present
      selector: "input[type='password'], input[type='tel'], input[inputmode='numeric']"
      value: "secret(USER_PASSCODE)"

  approve_2fa:
    # After passcode, Revolut sends a push to the mobile app. Upon
    # approval the browser redirects from sso.revolut.com back to
    # app.revolut.com. Matching on the app subdomain (not just "/home")
    # is defensive: Revolut sometimes lands on an intermediate path
    # before settling on /home, and the cross-origin hop from SSO can
    # briefly leave CDP's window.location.href reading a stale URL —
    # a broader includes fires as soon as either settles.
    # sso.revolut.com does not contain "app.revolut.com/", so this
    # reliably excludes the pre-login state.
    #
    # Surface the wait as a structured `await` prompt so the admin UI shows
    # a clear "waiting for your approval" card (with a live spinner) instead
    # of silent progress dots. The passcode auto-submits and Revolut sends
    # the push unconditionally, so this always fires once we're on SSO. The
    # card auto-clears the instant the browser redirects back to
    # app.revolut.com (i.e. the phone approval landed) — approving on the
    # phone is the whole interaction; the card's fallback button is only for
    # a slow redirect. On a tty/local run this degrades to a plain wait_url.
    - action: await_external_approval
      message: "Approve the sign-in in the Revolut app on your phone — this continues automatically once approved."
      url_includes: "app.revolut.com/"
      timeout: 300

  post_login:
    # Let the app finish loading and making initial API calls.
    # The extra wait ensures the PKCE token exchange and initial
    # data fetches complete before we capture credentials.
    - action: wait_network_idle
      seconds: 8

  capture_credentials:
    # Auth mechanism is unknown from the HAR — capture everything
    # potentially relevant. Prune after the first live run reveals
    # which mechanism actually carries auth.
    - action: capture_cookie_header
      host: "app.revolut.com"
      path: "/api/"
      as: cookie
    - action: capture_header
      name: "x-device-id"
      as: x_device_id
      retries: 5
      interval_seconds: 2

credentials:
  require:
    - cookie
  validate:
    - key: cookie
      not_empty: true
  map:
    - { from: cookie, as: cookie }
    - { from: x_device_id, as: x_device_id }

api_client:
  base_url: "https://app.revolut.com"
  api_root: "/api/retail"
  credentials: [cookie, x_device_id]
  auth_headers:
    Cookie: "{cookie}"
    x-device-id: "{x_device_id}"
    x-browser-application: "WEB_CLIENT"
    x-client-version: "100.0"
  batch_keys: []
  date_format: "%Y-%m-%d"
  endpoints:
    - name: fetch_wallet
      method: GET
      path: "/user/current/wallet"
    - name: fetch_wallets
      method: GET
      path: "/wallets"
    - name: fetch_accounts
      method: GET
      path: "/user/current/accounts"
    - name: fetch_bank_details
      method: GET
      path: "/bank-accounts/account-details"
      params:
        currency: "{currency}"
    - name: fetch_cards
      method: GET
      path: "/my-card/all"
    - name: fetch_card_detail
      method: GET
      path: "/my-card/{card_id}/v2"
    - name: fetch_vaults
      method: GET
      path: "/user/current/money-boxes"
    # Cursor-paginated declaratively: initial cursor = now (ms), each
    # continuation reads the cursor from the LAST row of the previous
    # batch via the startedDate / completedDate / createdDate alias
    # chain (coerced to ms), and stops when the cursor crosses below
    # the caller-provided from_ms boundary. The cycle-detection
    # backstop in the framework handles the "last row's timestamp >=
    # the cursor we just sent" terminator that Revolut's API hits at
    # the end of the feed.
    - name: fetch_pocket_transactions
      method: GET
      path: "/user/current/transactions/last"
      params:
        count: 50
        internalPocketId: "{pocket_id}"
        to: "{to}"
      pagination:
        kind: cursor
        initial_kwargs:
          to: "{now_ms}"
        cursor_from_last_row:
          to:
            fields: [startedDate, completedDate, createdDate]
            coerce: timestamp_ms
        continue_when:
          cursor_gt: { field: to, value: "{from_ms}" }
      response:
        extract_batch: [transactions, items]
    - name: fetch_cashback
      method: GET
      path: "/cashback"

extract:
  plan:
    steps:
      # Wallet — primary structure. NOT safe: a dead session must
      # propagate (abort with "re-run connect"), never be masked into a
      # partial payload.
      - fetch: fetch_wallet
        as: wallet
      - select: { from: wallet, path: pockets, default: [] }
        as: pockets

      # Bank account details (IBANs) — one request per distinct pocket
      # currency. Non-critical: a dead currency is skipped, not fatal.
      - for_each:
          source: pockets
          pluck: currency
          compact: true
          uniq: true
        as_item: currency
        as: bank_details
        do:
          - fetch: fetch_bank_details
            args: { currency: "{currency}" }
            as: detail
            safe: true
          - yield: { currency: "{currency}", details: "{detail}" }
            skip_if_nil: detail

      # Cards + vaults — non-critical, nil-on-failure (no default:, to
      # match the Ruby extractor which stored nil, not []).
      - fetch: fetch_cards
        as: cards
        safe: true
      - fetch: fetch_vaults
        as: vaults
        safe: true

      # Transactions per pocket. Cursor pagination (initial cursor = now,
      # cursor from last row's timestamp, stop on from_ms) is declared on
      # fetch_pocket_transactions above — one fetch returns all rows.
      - for_each:
          source: pockets
        as_item: pocket
        as: pocket_transactions
        collect: map
        key: "{pocket.id}"
        do:
          - fetch: fetch_pocket_transactions
            args: { pocket_id: "{pocket.id}", from_ms: "{from_ms}" }
            as: txns
            safe: true
            default: []
          - yield: "{txns}"
    output:
      wallet: "{wallet}"
      pockets: "{pockets}"
      bank_details: "{bank_details}"
      cards: "{cards}"
      vaults: "{vaults}"
      pocket_transactions: "{pocket_transactions}"

normalize:
  plan:
    steps:
      # --- shared: IBAN-by-currency map -----------------------------------
      # Revolut pockets share the parent wallet's IBAN per currency. Build a
      # currency → first-iban-bearing-account.iban map once; each pocket
      # reads it back. `where: { iban: { present: true } }` picks the first
      # account element that actually carries an iban.
      - select: { from: raw, path: bank_details, default: [] }
        as: bank_details
      - index_by:
          from: bank_details
          key: currency
          value: { path: details.accounts, where: { iban: { present: true } }, pick: iban }
        as: iban_by_currency
      - select: { from: raw, path: pocket_transactions, default: {} }
        as: pocket_transactions

      # --- pockets → checking accounts (+ their transactions) -------------
      - select: { from: raw, path: pockets, default: [] }
        as: pockets
      - for_each: { source: pockets }
        as_item: pocket
        as: pocket_results
        do:
          - select: { from: pocket, path: id }
            as: pocket_id
          - skip_when: { pocket_id: { absent: true } }
          - apply: join
            args: { parts: ["pocket:", "{pocket_id}"] }
            as: source_id
          - let: currency
            coalesce: ["{pocket.currency}", "EUR"]
          - apply: join
            args: { parts: ["Revolut ", "{currency}"] }
            as: default_name
          - let: name
            coalesce: ["{pocket.name}", "{default_name}"]
          - apply: cents
            args: { amount: "{pocket.balance}", already_minor: true }
            as: balance_cents
          - apply: cents_to_amount
            args: { cents: "{balance_cents}" }
            as: balance_amount
          # Parent IBAN stays in metadata only — surfacing it on Account#iban
          # collides canonical ids across a currency's pockets. source_id
          # drives the id. metadata is compacted (a nil type / iban drops).
          - lookup: { from: iban_by_currency, key: "{currency}" }
            as: parent_iban
          - apply: compact
            args:
              hash:
                revolut_pocket_id: "{pocket_id}"
                revolut_type: "{pocket.type}"
                revolut_parent_iban: "{parent_iban}"
                balance_source: "revolut_live:wallet"
            as: account_metadata
          - apply: build_account
            args:
              institution: "{config.institution}"
              source_id: "{source_id}"
              currency: "{currency}"
              name: "{name}"
              type: checking
              balance: { current: "{balance_amount}", timestamp: null }
              metadata: "{account_metadata}"
            as: account
          - lookup: { from: pocket_transactions, key: "{pocket_id}", default: [] }
            as: raw_txns
          - for_each: { source: raw_txns }
            as_item: tx
            as: txns
            do:
              # source_id MUST be per-leg: internal transfers arrive as one
              # envelope with multiple legs sharing `id` but distinct
              # `legId`. Keying on id collapses both legs to one canonical
              # id; downstream upsert-on-id then drops a leg. Prefer legId.
              - select: { from: tx, path: [legId, id] }
                as: tx_id
              - skip_when: { tx_id: { absent: true } }
              - select: { from: tx, path: [amount, legs.0.amount] }
                as: amount_raw
              - apply: cents
                args: { amount: "{amount_raw}", already_minor: true }
                as: amount_cents
              - skip_when: { amount_cents: { absent: true } }
              - skip_when: { amount_cents: { eq: 0 } }
              - apply: cents_to_amount
                args: { cents: "{amount_cents}" }
                as: amount
              - apply: pick
                args: { key: tx_date, source: "{tx}", aliases: "{config.field_aliases}" }
                as: tx_date_raw
              - apply: parse_date
                args:
                  value: "{tx_date_raw}"
                  input_timezone: "{config.input_timezone}"
                  output_timezone: "{config.output_timezone}"
                as: date
              - skip_when: { date: { absent: true } }
              - let: tx_currency
                coalesce: ["{tx.currency}", "{currency}", "EUR"]
              - apply: join
                args: { parts: ["{tx.description}"] }
                as: raw_description
              - select: { from: tx, path: [description, merchant.name, type] }
                as: cleaned_raw
              - apply: strip
                args: { value: "{cleaned_raw}" }
                as: description
              - apply: map_status
                args: { value: "{tx.state}", mapping: "{config.status_map}" }
                as: status
              # merchant: build {name, normalized} only when a non-blank
              # merchant name is present (first_present strips-and-blanks the
              # gate; the value keeps the original, unstripped name).
              - select: { from: tx, path: merchant.name }
                as: merchant_name
              - apply: first_present
                args: { candidates: ["{merchant_name}"] }
                as: merchant_name_ok
              - let: merchant
                value: { name: "{merchant_name}", normalized: true }
                when: { merchant_name_ok: { present: true } }
              - apply: build_transaction
                args:
                  account_id: "{account.id}"
                  source_id: "{tx_id}"
                  amount: "{amount}"
                  currency: "{tx_currency}"
                  date: "{date}"
                  description: "{description}"
                  raw_description: "{raw_description}"
                  status: "{status}"
                  merchant: "{merchant}"
                  metadata: { revolut: "{tx}" }
                as: txn
              - yield: "{txn}"
          - yield: { account: "{account}", txns: "{txns}" }

      # --- vaults → savings accounts --------------------------------------
      - select: { from: raw, path: vaults, default: [] }
        as: vaults
      - for_each: { source: vaults }
        as_item: vault
        as: vault_accounts
        do:
          - select: { from: vault, path: id }
            as: vault_id
          - skip_when: { vault_id: { absent: true } }
          - apply: join
            args: { parts: ["vault:", "{vault_id}"] }
            as: source_id
          - let: currency
            coalesce: ["{vault.currency}", "EUR"]
          - let: name
            coalesce: ["{vault.name}", "Revolut Vault"]
          - apply: pick
            args: { key: vault_balance, source: "{vault}", aliases: "{config.field_aliases}" }
            as: vault_balance_raw
          - apply: cents
            args: { amount: "{vault_balance_raw}", already_minor: true }
            as: balance_cents
          - apply: cents_to_amount
            args: { cents: "{balance_cents}" }
            as: balance_amount
          - apply: build_account
            args:
              institution: "{config.institution}"
              source_id: "{source_id}"
              currency: "{currency}"
              name: "{name}"
              type: savings
              balance: { current: "{balance_amount}", timestamp: null }
              metadata:
                revolut_vault_id: "{vault_id}"
                revolut_goal: "{vault.goal}"
                balance_source: "revolut_live:vault"
            as: account
          - yield: "{account}"

      # --- assemble (pockets first, then vaults; txns in pocket order) ----
      - apply: pluck
        args: { list: "{pocket_results}", key: account }
        as: pocket_accounts
      - apply: pluck
        args: { list: "{pocket_results}", key: txns }
        as: txn_groups
      - apply: flatten
        args: { list: "{txn_groups}" }
        as: transactions
      - concat: [pocket_accounts, vault_accounts]
        as: accounts
    output:
      accounts: "{accounts}"
      transactions: "{transactions}"
