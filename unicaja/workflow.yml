version: 1

config:
  key: unicaja
  default_lookback_days: 30
  error_signals:
    - text: "Ha ocurrido un error. Por favor, inténtelo de nuevo más tarde"
      message: "Cybersecurity blocked the login attempt"
    - selector: "div[data-testid='snackbar-fixed-container'] div[mode='WARNING']"
      message: "Cybersecurity blocked the login attempt"

secrets:
  USER_LOGIN:
    prompt: "Unicaja user / DNI"
  USER_PASSWORD:
    prompt: "Unicaja password"

pipeline:
  - connect
  - dismiss_cookie_banner
  - login
  - post_login
  - pre_arm_history
  - capture_credentials

phases:
  connect:
    - action: navigate
      url: "https://univia.unicajabanco.es/login"
    - action: wait_url
      includes: "univia"
      timeout: 15
  dismiss_cookie_banner:
    - action: wait
      seconds: 5
    - action: wait_for_first_of
      selectors:
        - "#onetrust-pc-btn-handler"
        - "input#username"
      timeout: 30
    - action: simulate_human
      duration: 3
    - action: click_if_present
      selector: "#onetrust-pc-btn-handler"
    - action: click_if_present
      selector: ".ot-pc-refuse-all-handler"
  login:
    - action: wait_for_selector
      selector: "input#username"
      timeout: 15
    - action: fill
      selector: "input#username"
      value: "secret(USER_LOGIN)"
    - action: fill
      selector: "input#pwd"
      value: "secret(USER_PASSWORD)"
    - action: click
      selector: "button[type='submit']"
    - action: wait_url
      includes: "posicion-global"
      timeout: 120
  post_login:
    - action: wait_network_idle
      seconds: 5
  # Arms the session so the /apis/externo/.../busqueda endpoint will return
  # history older than ~30 days. Unicaja requires a UI-driven search with a
  # far-back from-date that triggers an SMS OTP, which the user types in.
  # Every step is gated on lookback_days > 30 — for short runs the whole
  # phase is silently skipped and we fall through to capture_credentials.
  pre_arm_history:
    - action: click
      selector: "a[data-testid='wrapper-card-sLink'][href*='/cuentas/'][href$='/movimientos']"
      when_context: { lookback_days: { gt: 30 } }
    - action: wait_url
      includes: "/movimientos"
      timeout: 30
      when_context: { lookback_days: { gt: 30 } }
    # wait_url fires as soon as the URL matches, but React is still
    # hydrating — clicking too early leaves the click event with no
    # handler attached, so the button looks clicked but nothing happens.
    # Let the page go idle before we try to interact with it.
    - action: wait_network_idle
      seconds: 3
      when_context: { lookback_days: { gt: 30 } }
    # Opens the "Buscar movimientos" action sheet. Scoped to the
    # movements content container just in case; diagnostic confirmed
    # only one Buscar button is reachable so the scope is belt-and-
    # suspenders, not strictly required.
    - action: click_text
      text: "Buscar"
      role: button
      within: "div[class*='BlockMovements']"
      timeout: 30
      when_context: { lookback_days: { gt: 30 } }
    # Give the action sheet a beat to mount + animate open before we
    # start polling for its inputs.
    - action: wait
      seconds: 1
      when_context: { lookback_days: { gt: 30 } }
    - action: wait_for_selector
      selector: "input[name='dateFrom']"
      timeout: 15
      when_context: { lookback_days: { gt: 30 } }
    # Sentinel from-date: must be >30 days ago (to trigger the OTP) AND
    # ≤18 months ago (the form's client-side max range — older dates
    # are rejected as "Fecha fuera de rango"). 01/04/2025 gives ~12
    # months on the 2026-04-11 baseline, leaving headroom on both sides.
    # TODO: when this date creeps past the 18-month limit (mid-2026),
    # either bump it or add a framework template filter like
    # `{months_ago|12|date}` to compute it dynamically.
    # clear: true resets the React-controlled pre-filled value before
    # typing so we replace instead of append.
    - action: fill
      selector: "input[name='dateFrom']"
      value: "01/04/2025"
      clear: true
      when_context: { lookback_days: { gt: 30 } }
    - action: click_text
      text: "Buscar movimientos"
      role: button
      within: "div[class*='StyledActionSheetDesktop']"
      timeout: 15
      when_context: { lookback_days: { gt: 30 } }
    # After the action sheet submits, the movements list re-renders
    # with a "Autorizar consulta" consent button — clicking it is
    # what actually triggers the SMS OTP. Without this click, no code
    # is sent and nothing prompts the user. Scoped to the results
    # container so we don't match any stray accept buttons elsewhere.
    - action: wait_network_idle
      seconds: 3
      when_context: { lookback_days: { gt: 30 } }
    - action: click_text
      text: "Autorizar consulta"
      role: button
      within: "div[class*='BlockCardsMovements']"
      timeout: 30
      when_context: { lookback_days: { gt: 30 } }
    # Wait for the "Clave de seguridad" dialog (StyledActionSheetDesktop
    # titled "Ver movimientos") to mount and its 6-digit input to
    # render. The field is a tel input with autocomplete="one-time-code".
    - action: wait_for_selector
      selector: "input[data-testid='InputSecurityCode']"
      timeout: 60
      when_context: { lookback_days: { gt: 30 } }
    # Prompt the user for the SMS code and type it into the input.
    # No submit_selector here: the "Firmar" button starts disabled and
    # React only enables it after 6 digits land in state, so we wait
    # for the :not([disabled]) state explicitly below before clicking.
    - action: prompt_stdin_and_fill
      selector: "input[data-testid='InputSecurityCode']"
      prompt: "Enter the SMS code Unicaja sent you: "
      timeout: 300
      when_context: { lookback_days: { gt: 30 } }
    - action: wait_for_selector
      selector: "button[data-testid='signatureModal-button-submit']:not([disabled])"
      timeout: 10
      when_context: { lookback_days: { gt: 30 } }
    - action: click
      selector: "button[data-testid='signatureModal-button-submit']"
      when_context: { lookback_days: { gt: 30 } }
    - action: wait_network_idle
      seconds: 3
      when_context: { lookback_days: { gt: 30 } }
  capture_credentials:
    - action: reload
    - action: wait
      seconds: 4
    - action: capture_header
      name: "tokencsrf"
      as: "tokencsrf"
      retries: 3
      interval_seconds: 2
    - action: capture_cookie_header
      host: "univia.unicajabanco.es"
      path: "/services/rest/"
      as: "cookie"

credentials:
  require:
    - cookie
    - tokencsrf
  map:
    - from: cookie
      as: cookie
    - from: tokencsrf
      as: tokencsrf

api_client:
  base_url: "https://univia.unicajabanco.es"
  # No api_root — endpoints span two path prefixes:
  #   /services/rest/api  (standard endpoints)
  #   /apis/externo       (extended-history busqueda, requires OTP arming)
  expected_content_type: "application/json"
  credentials:
    keys: [cookie, tokencsrf]
    required: true
  batch_keys:
    - movimientos
    - listaMovimientos
  date_format: "%Y-%m-%d"
  auth_headers:
    Cookie:          "{cookie}"
    tokencsrf:       "{tokencsrf}"
    Accept:          "application/json, text/plain, */*"
    Accept-Language: "es-ES,es;q=0.9"
    Origin:          "https://univia.unicajabanco.es"
    Referer:         "https://univia.unicajabanco.es/posicion-global"
  endpoints:
    - name: fetch_listacuentas
      method: GET
      path: "/services/rest/api/productos/listacuentas"
    - name: fetch_listatarjetas
      method: GET
      path: "/services/rest/api/productos/listatarjetas"
    - name: fetch_listaprestamos
      method: GET
      path: "/services/rest/api/productos/listaprestamos"
    # Standard movements endpoint — works for the last ~30 days without
    # OTP arming.  Always used for the recent-window fetch.
    - name: fetch_all_account_movements
      method: POST
      path: "/services/rest/api/cuentas/movimientos"
      form:
        ppp:        "{ppp}"
        fechaDesde: "{fecha_desde|date}"
        impDesde:   "0"
      response:
        extract_batch: [movimientos, listaMovimientos]
    # Extended-history endpoint — requires the session to be armed via
    # pre_arm_history (OTP). Cursor-paginated declaratively: the loop
    # sends indOperacion=I on the first call (no cursor) and indOperacion=P
    # plus the saldoUltMov / numUltMov cursor on every continuation,
    # reading both values out of the previous response's masMovimientos
    # envelope. Stops when masMovimientos.indMasMovimientos != "S" or
    # either cursor field is missing.
    - name: fetch_extended_account_movements
      method: POST
      path: "/apis/externo/unicaja/banca-digital/cuentas/movimientos/busqueda"
      form:
        ppp:          "{ppp}"
        indOperacion: "{ind_operacion}"
        fechaDesde:   "{fecha_desde|date}"
        fechaHasta:   "{fecha_hasta|date}"
        tipologia:    "T"
        saldoUltMov:  "{saldo_ult_mov}"
        numUltMov:    "{num_ult_mov}"
      pagination:
        kind: cursor
        initial_kwargs:  { ind_operacion: "I" }
        continue_kwargs: { ind_operacion: "P" }
        cursor_from_response:
          saldo_ult_mov: masMovimientos.ultimoSaldo.cantidad
          num_ult_mov:   masMovimientos.numUltimoMovimiento
        continue_when:
          response_path: masMovimientos.indMasMovimientos
          equals: "S"
      response:
        extract_batch: [movimientos, listaMovimientos]
    - name: fetch_all_card_movements
      method: POST
      path: "/services/rest/api/tarjetas/movimientos/listadoMovimientos/v2"
      form:
        ppp:        "{ppp}"
        fechaDesde: "{fecha_desde|date}"
        impDesde:   "0"
      response:
        extract_batch: [movimientos, listaMovimientos]

extract:
  ruby: ./extractor.rb
  class: Freentonic::Providers::Unicaja::Extractor

normalize:
  ruby: ./normalizer.rb
  class: Freentonic::Providers::Unicaja::Normalizer
